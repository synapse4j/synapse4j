name: CI

on:
  push:
    branches: ['**'] # every branch, but not tags — a release tag has its own workflow
  pull_request:
  workflow_dispatch: # manual re-run, e.g. after a runner image update

# One run per ref: a newer push supersedes the run it is racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The runner's own Maven, logged for the record: no wrapper in this repository
      # by convention, and pinning would mean a third-party setup action.
      - name: Record toolchain
        run: mvn -version
      - name: Verify
        run: mvn -B verify
      # Sources and javadoc jars are built only under the release profile, so a javadoc error is
      # otherwise first met on a signed, publishing path. Built here with signing off, so a broken
      # doc fails CI rather than a release.
      - name: Verify the release build
        run: mvn -B -Prelease -Dgpg.skip=true package
