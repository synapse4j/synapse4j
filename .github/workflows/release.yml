name: Release

on:
  push:
    tags:
      - 'v*'

# One release at a time, and never cancel one mid-flight: a publish interrupted
# halfway is harder to recover than one that waits for the previous job. The group is a
# constant, not the ref: keyed by ref, two tags pushed together landed in groups of their
# own and published at once. GitHub holds one running and one pending task per group, so
# pushing a third tag while one runs and one waits cancels the waiting one — push release
# tags one at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # creating the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    # Bounded by the deploy's own wait (up to 30 min, the plugin's floor) plus this job's polling for
    # Central's queue (up to 30 min), plus checkout and the release build — 60 would cancel a job whose
    # artifacts Central has already accepted, leaving neither a release nor a draft.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central # written into settings.xml, must match publishingServerId
          # The three below name the environment variables holding the credentials, not the
          # values: the old server-username / server-password / gpg-passphrase spellings were
          # deprecated in setup-java v6 in favour of these.
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Check the tag names this version
        run: |
          version="$(mvn -q -N help:evaluate -Dexpression=revision -DforceStdout | tail -n1)"
          case "$version" in
            *-SNAPSHOT)
              echo "::error::revision $version is a snapshot; Maven Central refuses one"
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match revision $version in the pom"
            exit 1
          fi

      # A version on Central is immutable: a rerun must not try to publish it again. The portal is
      # what the deploy waits on, and it answers immediately, whereas repo1 lags behind it — asking
      # repo1 about a version published moments ago gets "not there", and the rerun then dies on a
      # duplicate upload before it ever reaches the release.
      - name: Check whether this version is already published
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          url="https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.synapse4j&name=synapse4j-core&version=${ver}"
          code="$(curl -sS -o /tmp/published.json -w '%{http_code}' -H "Authorization: Bearer $token" "$url")"
          # The status is what carries the signal: a rotated credential or a bad gateway would
          # otherwise leave the body empty and read as "not published", which is the one answer that
          # leads to a duplicate upload — Central refuses a version it already holds. Failing here is
          # deliberate for that reason alone; whether the version is out by the time the release is
          # staged is the release step's business, below.
          if [ "$code" != "200" ]; then
            echo "::error::Central answered $code for $url — cannot tell whether the version is out"
            exit 1
          fi
          if ! published="$(jq -r '.published // false' /tmp/published.json)"; then
            echo "::error::Central's answer was not the JSON this check expects — cannot tell whether the version is out"
            exit 1
          fi
          if [ "$published" = "true" ]; then
            echo "already on Maven Central — skipping the publish"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish to Maven Central
        if: env.SKIP_PUBLISH != 'true'
        run: mvn -B -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The body is this version's section of the changelog; a missing section falls back to
      # generated notes so a forgotten edit never blocks what Central already hosts.
      #
      # The release is staged only once the artifacts are usable. Central publishes automatically,
      # but on its own queue — slow enough, more than once, to outlast a whole job — so the deploy
      # above stops at "validated" and the wait happens here, bounded: a version confirmed published
      # gets a release, one that is not confirmed in time gets a draft, which a rerun (or an admin,
      # from the Releases page) publishes once the artifacts are actually out.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          url="https://central.sonatype.com/api/v1/publisher/published?namespace=io.github.synapse4j&name=synapse4j-core&version=${ver}"

          published=false
          for _ in $(seq 1 30); do
            code="$(curl -sS -o /tmp/published.json -w '%{http_code}' -H "Authorization: Bearer $token" "$url")"
            if [ "$code" = "200" ] && [ "$(jq -r '.published // false' /tmp/published.json)" = "true" ]; then
              published=true
              break
            fi
            # A rejected token will not heal by waiting, and staging a draft would hide it.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::Central answered $code for $url — the credentials are wrong, not the timing"
              exit 1
            fi
            echo "$ver is not published yet (Central answered $code); waiting"
            sleep 60
          done

          awk -v ver="$ver" 'index($0, "## [" ver "]") == 1 { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            echo "::warning::no changelog section for $ver; generating notes from the commits"
            notes=(--generate-notes)
          fi

          if [ "$published" = "true" ]; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              # A draft staged by an earlier run becomes the release now the artifacts are out.
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}"
            fi
          else
            echo "::warning::$ver is not confirmed published; staging a draft release"
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "a release for $GITHUB_REF_NAME already exists; leaving it as it is"
            else
              gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" "${notes[@]}"
            fi
          fi
